name: ios
on:
  push:
    paths: ['ios/**', 'loader/**', 'shim/**', '.github/workflows/ios.yml']
  workflow_dispatch:
jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch APK, SDL2/ANGLE, SDL headers
        run: |
          brew install ldid >/dev/null
          curl -sL -o g.apk https://github.com/tinsarfal/GDroid/releases/download/0.1.30/GDroid-0.1.30.apk
          mkdir apk && (cd apk && unzip -q ../g.apk 'lib/arm64-v8a/*' 'assets/runtime.zip')
          curl -sL -o ref.ipa https://github.com/ksagameng2/source-engine/releases/download/test/source-engine.ipa
          unzip -q ref.ipa 'Payload/hl2.app/Frameworks/*' -d ref
          ls ref/Payload/hl2.app/Frameworks
          curl -sL https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9.tar.gz | tar xz
      - name: Build
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CC="xcrun --sdk iphoneos clang -target arm64-apple-ios14.0 -isysroot $SDK -O2 -g -Wno-unused-function -Wno-deprecated-declarations -ISDL2-2.30.9/include"
          FW=ref/Payload/hl2.app/Frameworks
          $CC -c loader/elf_loader.c -o el.o
          for f in bionic jni platform bsignal bsync; do $CC -c shim/$f.c -o $f.o; done
          $CC -c ios/main.c -o main.o
          $CC -fobjc-arc -c ios/paths.m -o paths.o
          $CC -o gmod *.o -F$FW -weak_framework SDL2 -framework Foundation -framework UIKit -Wl,-rpath,@executable_path/Frameworks
      - name: Package
        run: |
          APP=Payload/GMod.app; mkdir -p $APP/Frameworks $APP/lib $APP/rt
          cp gmod ios/bundle/Info.plist $APP/
          ibtool --compile $APP/LaunchScreen.storyboardc ios/bundle/LaunchScreen.storyboard
          cp -R ref/Payload/hl2.app/Frameworks/{SDL2,libEGL,libGLESv2}.framework $APP/Frameworks/
          cp apk/lib/arm64-v8a/*.so $APP/lib/; rm -f $APP/lib/libSDL2.so
          (cd $APP/rt && unzip -q ../../../apk/assets/runtime.zip)
          codesign --entitlements ios/entitlements.plist --sign - --force --deep $APP
          codesign -d --entitlements - $APP/gmod || true
          otool -L $APP/gmod; for f in $APP/Frameworks/*.framework; do otool -L $f/$(basename $f .framework) | head -5; done; otool -l $APP/gmod | grep -A3 LC_RPATH || true
          zip -qry GMod.tipa Payload; ls -la GMod.tipa
      - name: Test IPAs
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CC="xcrun --sdk iphoneos clang -target arm64-apple-ios14.0 -isysroot $SDK -fobjc-arc"
          mk() { rm -rf T; mkdir -p T/Payload; cp -R $2 T/Payload/GMod.app; A=T/Payload/GMod.app
            $CC -DHELLO_TEXT="\"$1\"" ios/hello.m -framework UIKit -o $A/gmod
            codesign --entitlements ios/entitlements.plist --sign - --force --deep $A
            (cd T && zip -qry ../$1.tipa Payload); }
          mkdir -p E/GMod.app; cp ios/bundle/Info.plist E/GMod.app/; cp -R Payload/GMod.app/LaunchScreen.storyboardc E/GMod.app/
          mk TestA_bare E/GMod.app
          mk TestB_fullbundle Payload/GMod.app
          ls -la *.tipa
      - uses: actions/upload-artifact@v4
        with: { name: tests, path: "Test*.tipa" }
      - uses: actions/upload-artifact@v4
        with: { name: GMod-ipa, path: GMod.tipa }
