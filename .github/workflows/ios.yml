name: ios
on:
  push:
    paths: ['ios/**', 'loader/**', 'shim/**', 'tools/**', '.github/workflows/ios.yml']
  workflow_dispatch:
jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch APK, SDL2/ANGLE, SDL headers
        run: |
          brew install ldid >/dev/null
          curl -sL -o g.apk https://github.com/m7830380-cyber/wobble-turnip-k7q/releases/download/apk31/g31.apk
          mkdir apk && (cd apk && unzip -q ../g.apk 'lib/arm64-v8a/*' 'assets/runtime.zip' 'assets/touch_default.cfg' 'assets/touch_preview/*')
          curl -sL -o ref.ipa https://github.com/ksagameng2/source-engine/releases/download/test/source-engine.ipa
          unzip -q ref.ipa 'Payload/hl2.app/Frameworks/*' -d ref
          ls ref/Payload/hl2.app/Frameworks
          curl -sL https://github.com/libsdl-org/SDL/releases/download/release-2.30.9/SDL2-2.30.9.tar.gz | tar xz
          python3 -m pip install --break-system-packages -q pyelftools capstone || python3 -m pip install -q pyelftools capstone
          python3 tools/fix_x18.py apk/lib/arm64-v8a/*.so
      - name: Build
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CC="xcrun --sdk iphoneos clang -target arm64-apple-ios14.0 -isysroot $SDK -O2 -g -Wno-unused-function -Wno-deprecated-declarations -ISDL2-2.30.9/include"
          FW=ref/Payload/hl2.app/Frameworks
          $CC -c loader/elf_loader.c -o el.o && $CC -c loader/jit26.c -o jit26.o
          for f in bionic jni platform bsignal bsync avarg bsock; do $CC -c shim/$f.c -o $f.o; done
          $CC -c ios/main.c -o main.o
          $CC -fobjc-arc -c ios/paths.m -o paths.o
          $CC -fobjc-arc -c ios/glctx.m -o glctx.o
          $CC -fobjc-arc -c ios/webview.m -o webview.o
          $CC -fobjc-arc -c ios/launcher.m -o launcher.o
          $CC -fobjc-arc -c ios/touchedit.m -o touchedit.o; $CC -fobjc-arc -c ios/lan.m -o lan.o; $CC -fobjc-arc -c ios/kbfix.m -o kbfix.o
          for f in sw joinws mpjni; do $CC -c ios/steam/$f.c -o st_$f.o; done
          $CC -c ios/dec/LzmaDec.c -o lzmadec.o; $CC -O2 -c ios/dec/zstddeclib.c -o zstddec.o
          $CC -fobjc-arc -c ios/steam/net_ios.m -o st_net.o; $CC -fobjc-arc -c ios/steam/workshop_ui.m -o st_ui.o; $CC -fobjc-arc -c ios/steam/gameinst.m -o st_gi.o; $CC -fobjc-arc -c ios/steam/mp_ui.m -o st_mpui.o
          $CC -o gmod *.o -F$FW -framework SDL2 -framework Foundation -framework UIKit -framework Metal -framework QuartzCore -framework WebKit -framework CoreGraphics -framework UniformTypeIdentifiers -framework Security -lz -Wl,-rpath,@executable_path/Frameworks -Wl,-rpath,@executable_path/Frameworks/SDL2.framework -Wl,-rpath,@executable_path/Frameworks/libEGL.framework -Wl,-rpath,@executable_path/Frameworks/libGLESv2.framework
      - name: Package
        run: |
          APP=Payload/GMod.app; mkdir -p $APP/Frameworks $APP/lib $APP/rt
          cp gmod ios/bundle/Info.plist $APP/
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" -c "Set :CFBundleShortVersionString 1.0.${GITHUB_RUN_NUMBER}" -c "Add :GMBuildSHA string ${GITHUB_SHA::7}" $APP/Info.plist
          ibtool --compile $APP/LaunchScreen.storyboardc ios/bundle/LaunchScreen.storyboard
          cp -R ref/Payload/hl2.app/Frameworks/{SDL2,libEGL,libGLESv2}.framework $APP/Frameworks/
          cp apk/lib/arm64-v8a/*.so $APP/lib/; rm -f $APP/lib/libSDL2.so $APP/lib/libopenxr_loader.so
          (cd $APP/rt && unzip -q ../../../apk/assets/runtime.zip)
          cp -R ios/bundle/rt_extra/. $APP/rt/
          mkdir -p $APP/touch && python3 tools/vtf2png.py apk/assets/touch_preview $APP/touch && cp apk/assets/touch_default.cfg $APP/touch/
          cp ios/bundle/touch/*.png $APP/touch/; for f in $APP/touch/touch_default.cfg $APP/rt/cfg/touch_default.cfg; do [ -f $f ] && printf '\n%s\n' 'touch_addbutton "friends" "gmodvr_touch_icons/ios_friends" "gmod_ios_friends" 0.640000 0.000000 0.700000 0.133333 255 255 255 155 8192 1' >> $f; done; ls $APP/touch | wc -l
          codesign --entitlements ${3:-ios/entitlements.plist} --sign - --force --deep $APP
          codesign -d --entitlements - $APP/gmod || true
          otool -L $APP/gmod; for f in $APP/Frameworks/*.framework; do otool -L $f/$(basename $f .framework) | head -5; done; otool -l $APP/gmod | grep -A3 LC_RPATH || true
          zip -qry GMod.tipa Payload; ls -la GMod.tipa
      - uses: actions/upload-artifact@v4
        with: { name: GMod-ipa, path: GMod.tipa }
