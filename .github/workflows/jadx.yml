name: jadx
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          curl -sL -o g.apk https://github.com/m7830380-cyber/wobble-turnip-k7q/releases/download/apk31/g31.apk
          curl -sL -o j.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q j.zip -d jadx
          jadx/bin/jadx -d out --no-res --show-bad-code g.apk || true
          mkdir -p src; cp -r out/sources/com src/ || true
          find src -name "*.java" | wc -l; ls src/com
      - uses: actions/upload-artifact@v4
        with: {name: java, path: src}
