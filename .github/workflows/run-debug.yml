name: run-debug
on:
  push:
    paths: ['loader/**', 'shim/**', 'tools/**', '.github/workflows/run-debug.yml']
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Deps + APK
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gdb strace libsdl2-dev llvm libgles2-mesa-dev libegl1-mesa-dev libgl1-mesa-dri xvfb >/dev/null
          curl -sL -o g.apk https://github.com/tinsarfal/GDroid/releases/download/0.1.30/GDroid-0.1.30.apk
          mkdir apk && cd apk && unzip -q ../g.apk 'lib/arm64-v8a/*' 'assets/runtime.zip' && mkdir rt && cd rt && unzip -q ../assets/runtime.zip && ls
      - name: Build
        run: gcc -O1 -g -DBIONIC_HOST_TEST_NO_TP -Wno-unused-function -o m loader/elf_loader.c shim/bionic.c shim/jni.c shim/platform.c shim/bsignal.c shim/bsync.c shim/run_main.c -ldl -lpthread
      - name: Run under gdb
        run: |
          mkdir -p out
          if GMKEY="${{ secrets.GMKEY }}" GH_TOKEN="${{ github.token }}" sh tools/getdata.sh; then echo REAL DATA; else
            rm -rf data; mkdir -p data/garrysmod && cp tools/fakegame/gameinfo.txt data/garrysmod/ && ln -s $PWD/apk/rt data/garrysmod/runtime && ln -s $PWD/apk/rt/platform data/platform; fi
          mkdir -p $PWD/wr; export SOURCEVR_WRITE_GAME_PATH=$PWD/wr SOURCEVR_SHARED_CONTENT_PATH=$PWD/data LIBDIR=$PWD/apk/lib/arm64-v8a APP_DATA_PATH=$PWD/data VALVE_GAME_PATH=$PWD/data SDL_VIDEODRIVER=x11 DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEO_X11_FORCE_EGL=1 SDL_OPENGL_ES_DRIVER=1 GL_VERBOSE=1 SDL_AUDIODRIVER=dummy SO_MAP=1 JNI_VERBOSE=1
          (Xvfb :99 -screen 0 1280x720x24 >/dev/null 2>&1 &); sleep 2
          timeout 600 gdb -q -batch -x tools/dbg.gdb --args ./m -game garrysmod > out/gdb.txt 2> out/stderr.txt || true
          timeout 300 strace -f -e trace=openat,stat,newfstatat,access -o out/strace.txt ./m -game garrysmod >/dev/null 2>&1 || true; gzip -f out/strace.txt
          tail -60 out/stderr.txt; cat out/gdb.txt | tail -150
          cp -r data/files/diagnostics out/ 2>/dev/null || true
      - name: Symbolize
        run: python3 tools/symbolize.py out/stderr.txt out/gdb.txt apk/lib/arm64-v8a > out/sym.txt || true; cat out/sym.txt
      - uses: actions/upload-artifact@v4
        with: { name: run-debug, path: out }
